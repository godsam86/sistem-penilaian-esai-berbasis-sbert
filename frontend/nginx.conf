server {
    listen 80;
    server_name localhost;

    # FIX 413: Naikkan batas ukuran upload dari default 1MB ke 50MB
    # Diperlukan untuk upload file PDF/DOCX ke Knowledge Base
    client_max_body_size 50M;

    root /usr/share/nginx/html;
    index index.html;

    # React SPA - semua path non-API diarahkan ke index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy semua request /api/ ke backend Django
    location /api/ {
        proxy_pass         http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeout lebih panjang untuk proses SBERT embedding yang butuh waktu
        proxy_connect_timeout 300s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Buffer untuk upload file besar
        proxy_request_buffering off;
        client_max_body_size 50M;
    }

    # Serve foto profil langsung dari backend via /media/
    location /media/ {
        proxy_pass       http://backend:8000/media/;
        proxy_set_header Host $host;
    }

    # Gzip untuk performa lebih baik
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_vary on;
    gzip_min_length 1024;
}
